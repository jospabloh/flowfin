<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security hardening -->
    <!-- X-Frame-Options as meta (browser fallback; authoritative via security-sw.js service worker) -->
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <!-- CSP: block mixed content and restrict framing -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; connect-src 'self' https:; font-src 'self' https: data:;" />
    <link rel="manifest" href="/manifest.json" />
    <title>FlowFin — Finanzas familiares simples</title>
    <meta name="description" content="Captura gastos, viajes y metas en segundos. Mantén las cuentas claras con tu familia. Privado por diseño." />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowFin" />
    <meta property="og:title" content="FlowFin — Finanzas familiares simples" />
    <meta property="og:description" content="Captura gastos, viajes y metas en segundos. Mantén las cuentas claras con tu familia." />
    <meta property="og:image" content="https://media.base44.com/images/public/69b97ea9c9a713486b5a01fd/e0e86c747_FlowFin_logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlowFin — Finanzas familiares simples" />
    <meta name="twitter:description" content="Captura gastos, viajes y metas en segundos. Mantén las cuentas claras con tu familia." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/69b97ea9c9a713486b5a01fd/e0e86c747_FlowFin_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Frame-buster: redirect top frame if we are embedded (best-effort, never clears DOM)
      if (window.self !== window.top) {
        try { window.top.location = window.self.location; } catch (_) { /* cross-origin iframe — leave DOM intact */ }
      }
      // Register security service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/security-sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
  </body>
</html>
